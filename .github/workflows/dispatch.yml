name: Dispatch New Topics

on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sadece logla, gercek dispatch gonderme"
        required: true
        type: boolean
        default: false
      min_score:
        description: "Test icin niche_score esigini gecici düşür (varsayilan 75)"
        required: false
        default: "75"

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nis arastirmasini tazele (dispatch'ten once analysis.json'lari guncelle)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python batch_research.py

      - name: Arastirma raporlarini GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/
          if git diff --cached --quiet; then
            echo "Yeni arastirma degisikligi yok."
          else
            git commit -m "Refresh niche research before dispatch"
            git push
          fi

      - name: Yeni konulari hedef repolara dagit
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          DISPATCH_DRY_RUN: ${{ inputs.dry_run }}
          MIN_SCORE: ${{ inputs.min_score }}
        run: python dispatcher.py

      - name: Dispatch log'unu GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/dispatch-log.json
          if git diff --cached --quiet; then
            echo "Yeni dispatch kaydi yok."
          else
            git commit -m "Update dispatch log"
            git push
          fi

      - name: Hata bildirimi gonder (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID yok, bildirim atlaniyor."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT=$(printf '⚠️ Workflow basarisiz\nRepo: %s\nWorkflow: %s\nRun: %s' \
            "${{ github.repository }}" "${{ github.workflow }}" "$RUN_URL")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="$TEXT" \
            || echo "Telegram bildirimi gonderilemedi (workflow yine de basarisiz olarak isaretli kalir)."
