name: Cigong Pilot (Metal)

on:
  workflow_dispatch:
    inputs:
      offline:
        description: "Yer-tutucu gorsellerle kuru calistirma (gercek sanat uretmez, ffmpeg/montaj testi)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cigong

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt

      - name: Caveat fontunu indir (Turkce destekli el yazisi/firca fontu)
        run: |
          curl -fsSL -o assets/fonts/Caveat-Regular.ttf \
            "https://raw.githubusercontent.com/google/fonts/main/ofl/caveat/Caveat%5Bwght%5D.ttf" \
            || echo "Caveat indirilemedi, calligraphy.py otomatik olarak DejaVuSans-Bold'a duşecek."

      - name: Metal pilotunu calistir
        env:
          CIGONG_OFFLINE: ${{ inputs.offline && '1' || '0' }}
        run: python3 run_pilot.py

      - name: Ciktiyi dogrula
        run: |
          test -f out/metal_pilot.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 out/metal_pilot.mp4

      - name: Ciktiyi artifact olarak yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cigong-metal-pilot-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            cigong/out/metal_pilot.mp4
            cigong/out/plans/
